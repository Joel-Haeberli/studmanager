apiVersion: apps/v1
kind: Deployment
metadata:
  name: studmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: studmanager
  template:
    metadata:
      labels:
        app: studmanager
    spec:
      containers:
        - name: studmanager
          image: studmanager
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: studmanager-secrets
                  key: PASSWORD_HASH
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: studmanager-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/auth/login
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: studmanager-data
