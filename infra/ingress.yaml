apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: studmanager
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: studmanager.example.com   # <-- replace with your hostname
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: studmanager
                port:
                  number: 80
  tls:
    - hosts:
        - studmanager.example.com     # <-- replace with your hostname
      secretName: studmanager-tls     # cert-manager will populate this
